[package]
name = "agent-workbench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision", "raw_value"] }
home = "0.5.12"
rustix = { version = "1.1.6", features = ["fs", "process"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "agent-workbench"
path = "src/main.rs"
