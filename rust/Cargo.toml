[package]
name = "agent-workbench-rs"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
home = "0.5.12"
rustix = { version = "1.1.6", features = ["fs"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "agent-workbench-rs"
path = "src/main.rs"
