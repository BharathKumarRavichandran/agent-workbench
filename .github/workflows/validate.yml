name: validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --manifest-path rust/Cargo.toml
      - run: ./scripts/agent-workbench validate
      - run: ./scripts/agent-workbench render --check
      - run: ./scripts/agent-workbench --profile pstack plan --target agents --destination "$RUNNER_TEMP/skills"

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - name: Set job-owned scratch directory
        run: |
          mkdir -p "$RUNNER_TEMP/agent-workbench"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP/agent-workbench" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --manifest-path rust/Cargo.toml -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml
