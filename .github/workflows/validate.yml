name: validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s tests -v
        env:
          TMPDIR: ${{ runner.temp }}
      - run: python3 -m agent_workbench validate
      - run: python3 -m agent_workbench render --check
      - run: python3 scripts/install_skills.py --target agents --dry-run --dest "$RUNNER_TEMP/skills"

  rust-plan-parity:
    name: rust-plan-parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set job-owned scratch directory
        run: |
          mkdir -p "$RUNNER_TEMP/agent-workbench-parity"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP/agent-workbench-parity" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Record platform and pinned oracle
        run: |
          uname -sm
          rustc --version
          python3 scripts/parity_oracle.py
      - run: cargo fmt --manifest-path rust/Cargo.toml -- --check
      - run: cargo check --manifest-path rust/Cargo.toml
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml
      - run: python3 scripts/check_rust_plan_parity.py
      - run: python3 -m unittest discover -s tests -q
